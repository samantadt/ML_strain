[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strain2d"
version = "0.1.0"
description = "Auditable strain-to-property learning and DFT preparation for one 2D material"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2", "PyYAML>=6,<7", "torch>=2.5,<3"]

[project.optional-dependencies]
dft = ["ase>=3.23,<4", "phonopy>=2.30,<5"]
xgboost = ["xgboost-cpu>=3,<4; platform_system == 'Linux'", "xgboost>=2,<4; platform_system != 'Linux'"]
dev = ["pytest>=8,<10", "ruff>=0.9"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6"]

[project.scripts]
strain2d = "strain2d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
